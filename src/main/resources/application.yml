server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: trip-scale-lite
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  
  # MVC异步请求配置
  mvc:
    async:
      request-timeout: 600000  # 300秒超时

# 旅行计划配置
trip:
  plan:
    max-retry-attempts: 3
    retry-delay-ms: 3000
    max-activities-per-city: 5
    activity-search-radius-km: 20.0
    activity-filter-radius-km: 100.0
    default-price-range: "10,5000"
    default-hotel-radius: 20
    default-hotel-radius-unit: "KM"
    # Google AI服务配置
    ai:
      timeout-seconds: 600  # AI服务超时时间90秒
      route-calculation-timeout-seconds: 600  # 路线计算超时时间60秒
    # 异步执行配置
    async:
      core-pool-size: 16
      max-pool-size: 16
      queue-capacity: 100
      keep-alive-seconds: 60
      thread-name-prefix: "TripPlan-"
    # 缓存配置
    cache:
      flight-dates:
        expire-after-write-minutes: 120
        maximum-size: 1000
        initial-capacity: 100
      flight-offers:
        expire-after-write-minutes: 120
        maximum-size: 1000
        initial-capacity: 100
      hotel-offers:
        expire-after-write-minutes: 120
        maximum-size: 1000
        initial-capacity: 100
      activities:
        expire-after-write-minutes: 120
        maximum-size: 1000
        initial-capacity: 100

# Amadeus API配置
amadeus:
  client-id: ${AMADEUS_CLIENT_ID:your_client_id}
  client-secret: ${AMADEUS_CLIENT_SECRET:your_client_secret}
  base-url: https://test.api.amadeus.com/v1
  timeout-ms: 50000
  max-connections: 100
  # Mock配置
  flight:
    dates:
      mock:
        enabled: true
    offers:
      mock:
        enabled: true
  hotel:
    offers:
      mock:
        enabled: true
  activities:
    mock:
      enabled: true
  locations:
    mock:
      enabled: true
  hotelofcity:
    mock:
      enabled: true

# 日志配置
logging:
  level:
    com.pkfare.trip.scale: DEBUG
    com.amadeus: INFO
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/trip-scale-lite.log
